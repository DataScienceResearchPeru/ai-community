name: Project proposal
description: Propose a community AI project.
title: "[Project]: "
labels: [project-proposal]
body:
  - type: input
    id: name
    attributes: { label: Project name }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem }
    validations: { required: true }
  - type: textarea
    id: solution
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: input
    id: stack
    attributes: { label: AI stack }
  - type: input
    id: repository
    attributes: { label: Repository }
  - type: input
    id: contributor
    attributes: { label: Contributor }
  - type: textarea
    id: help
    attributes: { label: Help needed }
